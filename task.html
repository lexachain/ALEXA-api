<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>LEXA Tasks</title>

<link
rel="stylesheet"
href="css/style.css">

<link
rel="stylesheet"
href="css/task.css">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="bg-gradient"></div>

<div class="task-page">

<div class="page-header">

<a
href="index.html"
class="back-btn">

<i class="fa-solid fa-chevron-left"></i>

</a>

<h2>
Daily Tasks
</h2>

<div></div>

</div>

<div id="taskGrid">

</div>

</div>

<nav
id="bottomNav"
class="bottom-nav">

<button
id="navHome"
type="button"
class="nav-item"
data-page="home">

<i class="fa-solid fa-house"></i>

<span>Home</span>

</button>

<button
id="navApps"
type="button"
class="nav-item"

<i class="fa-solid fa-table-cells-large"></i>

    id="navCommunity"
    type="button"

    <span>Community</span>

<button
id="navInvite"
type="button"
class="nav-item"
data-page="invite">

<i class="fa-solid fa-user-plus"></i>

</button>

<button
id="navWallet"
type="button"

data-page="wallet">
