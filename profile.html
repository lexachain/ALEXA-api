<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>LEXA Profile</title>

<link rel="stylesheet"
href="css/style.css">
<link rel="stylesheet"
href="css/profile.css">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>
<body>

<div class="bg-gradient"></div>

<section class="profile-page">

<section class="profile-card glass-card">

<div class="profile-container">

    <a href="index.html" class="back-btn">
        <i class="fa-solid fa-arrow-left"></i>
    </a>

    <div class="profile-header">

    <img
    id="profileAvatar"
    src="assets/default-avatar.png"
    class="profile-avatar">

    <button id="uploadPhoto">
        Edit Picture
    </button>

    <input
    type="file"
    id="avatarInput"
    accept="image/*"
    hidden>

</div>

    <div class="profile-field">
        <label>Username</label>
        <div class="field-box">
            <i class="fa-regular fa-user"></i>
            <span id="profileUsername">
                Loading...
            </span>
        </div>
    </div>

    <div class="profile-field">
        <label>Email</label>
        <div class="field-box">
            <i class="fa-regular fa-envelope"></i>
            <span id="profileEmail">
                Loading...
            </span>
        </div>
    </div>

    <div class="profile-field">
        <label>Full Name</label>
        <div class="field-box">
            <i class="fa-regular fa-id-card"></i>
            <span id="profileName">
                Loading...
            </span>
        </div>
    </div>

    <div class="profile-field">
        <label>Country</label>
        <div class="field-box">
            <i class="fa-solid fa-globe"></i>
            <span id="profileCountry">
                Loading...
            </span>
        </div>
    </div>

    <div class="profile-field">
        <label>Date of Birth</label>
        <div class="field-box">
            <i class="fa-regular fa-calendar"></i>
            <span id="profileDob">
                Loading...
            </span>
        </div>
    </div>

    <button id="changePasswordBtn">
Change Password
</button>

    <button
    id="logoutBtn"
    class="logout-btn">

        Logout

    </button>

</div>
</section>

</section>
<div id="logoutModal" class="logout-modal">

<div class="logout-card">

<div class="logout-icon">
<i class="fa-solid fa-right-from-bracket"></i>
</div>

<h2>
Logout Account
</h2>

<p>
Are you sure you want to logout from LEXA?
</p>

<div class="logout-actions">

<button id="cancelLogoutBtn">
Cancel
</button>

<button id="confirmLogoutBtn">
Logout
</button>

</div>

</div>

</div>
<div id="successModal" class="info-modal">

    <div class="info-card">

        <div class="success-icon">
    <i class="fa-solid fa-envelope-circle-check"></i>
</div>

        <h2>Reset Link Sent</h2>

<p>
A password reset link has been sent to:
</p>

<p
id="resetEmailText"
class="change-password-email">
</p>

<button id="closeSuccess">
    Got It
</button>

    </div>

</div>
<div
id="changePasswordModal"
class="confirm-modal">

<div class="change-password-box">

<div class="change-password-icon">

<i class="fa-solid fa-lock"></i>

</div>

<h2>
Change Password
</h2>

<p>
A password reset link will be sent to:
</p>

<p
id="changePasswordEmail"
class="change-password-email">
</p>

<div class="change-password-actions">

<button
id="cancelPasswordChange">

Cancel

</button>

<button
id="confirmPasswordChange">

Change Password

</button>

</div>

</div>

</div>


<script
type="module"
src="js/profile.js">
</script>

</body>
</html>
