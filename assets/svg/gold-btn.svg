      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <filter id="outerGlow" x="-18%" y="-24%" width="136%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4.5" result="blurGold"/>
      <feColorMatrix in="blurGold" type="matrix"
        values="1 0 0 0 0.83
                0 1 0 0 0.69
                0 0 1 0 0.22
                0 0 0 0.55 0" result="goldGlow"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="6.5" result="blurEmerald"/>
