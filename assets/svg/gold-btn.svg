    </linearGradient>

    <linearGradient id="edgeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF8D8" stop-opacity="0.95"/>
      <stop offset="48%" stop-color="#D4AF37" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#53D9A3" stop-opacity="0.92"/>
